# /etc/nrld.conf - configuracion de NeonatoX nrld (lo escribe el instalador).
# Formato: "key = value" por linea; comentarios con '#'. La clave `strict`
# activa el modo estricto global (falla limpio si falta alguna lib en el
# sysroot) sin necesidad de NEONATOX_STRICT_SYSROOT.
# La ruta del sysroot NO es configurable en runtime: es el default del build
# (NEO_SYSROOT, /usr/lib/glibc6). Estas claves solo ajustan el entorno que
# nrld exporta:
#   library_path = LD_LIBRARY_PATH que nrld construye para el hijo
#   proxy        = ruta del proxy LD_PRELOAD (libnrld-proxy.so)
library_path = @LIBRARY_PATH@
proxy = @PROXY@
# strict
